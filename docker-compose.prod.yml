# docker compose --env-file .env.docker.prod -f docker-compose.prod.yml up -d
#
# -d flag is detached mode, which runs the containers in the background.
# you dont need to keep the terminal open after running the command.
#
# OR
# docker compose -f docker-compose.prod.yml \
#   -e POSTGRES_PASSWORD=xxx \
#   -e POSTGRES_USER=xxx \
#   -e POSTGRES_DB=xxx \
#   up -d

name: drawith-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: drawith-postgres-prod
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: drawith-app-prod
    environment:
      DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

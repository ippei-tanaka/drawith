name: Docker Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      POSTGRES_HOST: drawith-postgres
      POSTGRES_DB: drawith_test_db
      POSTGRES_USER: drawith_test_user
      POSTGRES_PASSWORD: drawith-test-password
      DRAWITH_DATABASE_URL: postgresql://drawith_test_user:drawith-test-password@drawith-postgres:5432/drawith_test_db
      BETTER_AUTH_SECRET: drawith-test-secret
      BETTER_AUTH_URL: http://drawith-app:3000
      GRAPHQL_URI: http://drawith-app:3000/api/graphql
      TEST_APP_URL: http://drawith-app:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker test suite
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests

      - name: Tear down test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
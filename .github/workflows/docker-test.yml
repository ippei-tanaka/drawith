name: Docker Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DRAWITH_DATABASE_HOST: drawith-postgres
      DRAWITH_DATABASE_PORT: 5432
      DRAWITH_DATABASE_NAME: drawith_test_db
      DRAWITH_DATABASE_USER: drawith_test_user
      DRAWITH_DATABASE_PASSWORD: drawith-test-password
      BETTER_AUTH_SECRET: drawith-test-secret
      BETTER_AUTH_URL: http://drawith-app:3000
      DRAWITH_GRAPHQL_URI: http://drawith-app:3000/api/graphql
      DRAWITH_TEST_APP_URL: http://drawith-app:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker test suite
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests

      - name: Tear down test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
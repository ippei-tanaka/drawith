# docker compose --env-file .env.docker.dev -f docker-compose.dev.yml up --build --watch


name: drawith-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: drawith-postgres-dev
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: drawith-app-dev
    environment:
      BETTER_AUTH_URL: $BETTER_AUTH_URL
      BETTER_AUTH_SECRET: $BETTER_AUTH_SECRET
      GRAPHQL_URI: $GRAPHQL_URI
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      NODE_ENV: $NODE_ENV
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - package.json
            - node_modules/
            - .pnp
            - .pnp.*
            - .yarn/
            - coverage/
            - .next/
            - out/
            - build/
            - .vercel/
            - "*.pem"
            - npm-debug.log*
            - yarn-debug.log*
            - yarn-error.log*
            - .pnpm-debug.log*
            - .env*
            - "*.tsbuildinfo"
            - .neon-dev-branch.json
            - next-env.d.ts
            - .vscode/
        - action: rebuild
          path: package.json

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: drawith-postgres
    environment:
      POSTGRES_USER: drawith_user
      POSTGRES_PASSWORD: drawith_password
      POSTGRES_DB: drawith_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawith_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: drawith-app
    environment:
      DATABASE_URL: postgresql://drawith_user:drawith_password@postgres:5432/drawith_db
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: npm start

volumes:
  postgres_data:
